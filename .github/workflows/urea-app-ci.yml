name: Urea Android Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'UreaClientApp-source-v1.0.0.zip'
      - '.github/workflows/urea-app-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack source
        run: unzip -q UreaClientApp-source-v1.0.0.zip

      - name: Build release APK
        working-directory: UreaClientApp
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare artifact
        run: |
          mkdir -p ci-output/build-tools/lib
          cp UreaClientApp/app/build/outputs/apk/release/app-release-unsigned.apk ci-output/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" ci-output/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" ci-output/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ci-output/build-tools/lib/
          sha256sum ci-output/app-release-unsigned.apk | tee ci-output/SHA256.txt

      - name: Upload unsigned APK and signer
        uses: actions/upload-artifact@v4
        with:
          name: urea-client-unsigned-apk
          path: ci-output/
          if-no-files-found: error
