name: Urea Android Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'build-src/**'
      - '.github/workflows/urea-app-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Recover V1.1 source
        run: |
          cat build-src/v11s-* > UreaClientApp-source-v1.1.0.zip
          echo "60999cf30324fc1b34e158b265e84589b4b3acd02a583f537b2f9bb0427b08ed  UreaClientApp-source-v1.1.0.zip" | sha256sum -c -
          unzip -o UreaClientApp-source-v1.1.0.zip
          test -s UreaClientApp/app/src/main/java/com/urea/selfservice/client/UreaApplication.java
          test -s UreaClientApp/app/src/main/java/com/urea/selfservice/client/HomeActivity.java
          test -s UreaClientApp/app/src/main/java/com/urea/selfservice/client/OrdersActivity.java
          test -s UreaClientApp/app/src/main/java/com/urea/selfservice/client/SalesActivity.java
          test -s UreaClientApp/app/src/main/java/com/urea/selfservice/client/AlertsActivity.java
          grep -q 'versionName "1.1.0"' UreaClientApp/app/build.gradle

      - name: Build release APK
        working-directory: UreaClientApp
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Align and prepare artifact
        run: |
          mkdir -p ci-output/build-tools/lib
          UNSIGNED=UreaClientApp/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=ci-output/app-release-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$ALIGNED" | tail -5 | tee ci-output/ZIPALIGN.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ci-output/build-tools/lib/
          sha256sum "$ALIGNED" | tee ci-output/SHA256.txt

      - name: Upload aligned APK and signer
        uses: actions/upload-artifact@v4
        with:
          name: urea-client-v1.1-aligned-apk
          path: ci-output/
          if-no-files-found: error
